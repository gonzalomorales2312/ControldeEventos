# Copiar a /etc/nginx/sites-available/eventos y reemplazar TU_DOMINIO.
# Certbot agrega después el bloque HTTPS automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO www.TU_DOMINIO;

    root /var/www/eventos;
    index index.php;

    # Las imágenes de boleta se suben hasta 2 MB
    client_max_body_size 4m;

    # Carpetas y archivos que nunca deben servirse
    location ~ ^/(includes|deploy)/ { deny all; }
    location ~ /\.            { deny all; }
    location = /config.php    { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Ajuste la versión según: php -v  (8.1, 8.2, 8.3...)
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
